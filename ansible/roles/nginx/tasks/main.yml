---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Configure the EpicBook reverse proxy
  ansible.builtin.template:
    src: epicbook.conf.j2
    dest: /etc/nginx/sites-available/epicbook
    mode: "0644"
  notify: Reload nginx

- name: Enable the EpicBook site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/epicbook
    dest: /etc/nginx/sites-enabled/epicbook
    state: link
  notify: Reload nginx

- name: Disable the default Nginx page
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Test the Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Make sure Nginx is enabled and running
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Apply any pending reload now
  ansible.builtin.meta: flush_handlers

# Project-local Ansible settings (used locally AND by the pipeline)
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
remote_user = azureuser
retry_files_enabled = False
# These VMs are created fresh by Terraform, so there is no known_hosts entry yet
host_key_checking = False
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

# EpicBook reverse proxy: the ONLY public entry point (port 80)

# Structured JSON access log. Logs the path ($uri) without query strings,
# and no headers, cookies or tokens.
log_format epicbook_json escape=json
  '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream":"$upstream_addr",'
  '"upstream_status":"$upstream_status","user_agent":"$http_user_agent"}';

upstream frontend_upstream { server frontend:80; }
upstream backend_upstream  { server backend:8080; }

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/epicbook_access.log epicbook_json;
    error_log  /var/log/nginx/epicbook_error.log warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1) Static frontend assets -> frontend container
    location /assets/ {
        proxy_pass http://frontend_upstream;
    }

    # 2) Health endpoint -> backend (exact match; not logged, to avoid probe noise)
    location = /health {
        proxy_pass http://backend_upstream;
        access_log off;
    }

    # 3) API requests -> backend (same origin, so NO CORS headers are needed)
    location /api/ {
        proxy_pass http://backend_upstream;
    }

    # 4) Application pages (/, /cart, /gallery, /category/...) -> backend
    location / {
        proxy_pass http://backend_upstream;
    }
}
